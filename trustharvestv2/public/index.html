<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#16251c">
<title>TrustHarvest</title>
<style>
:root{--leaf-50:#eef6f0;--leaf-100:#d6eadc;--leaf-500:#2e7d4f;--leaf-700:#1f5c38;--leaf-900:#16251c;--maize:#f2b705;--bad:#b3261e;--text-muted:#4b5e51}
*{box-sizing:border-box}
body{margin:0;background:var(--leaf-50);color:var(--leaf-900);font:17px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif}
header{background:var(--leaf-900);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:20px;letter-spacing:.2px}
header b i{font-style:normal;color:var(--leaf-100)}
main{max-width:720px;margin:0 auto;padding:16px 16px 90px;background:var(--leaf-50)}
#hero{position:relative}
#hero:after{content:"";display:block;height:16px;background:#fff;clip-path:polygon(0 0,100% 0,100% 45%,0 100%)}
.landing-section{padding:72px 24px}
.landing-section:nth-child(odd){background:#fff}
.landing-section:nth-child(even){background:var(--leaf-50)}
.landing-section h2{margin:0 0 16px}
@media(max-width:599px){.landing-section{padding:48px 20px}}
h2{font-size:22px;margin:18px 0 10px}
.card{background:#fff;border:1px solid var(--leaf-100);border-top:3px solid transparent;border-radius:14px;padding:14px;margin-bottom:12px;transition:border-color .15s ease}
.card:hover,.card:focus-within{border-top:3px solid var(--leaf-500)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.price{font-weight:800;font-size:20px}
.mute{color:var(--text-muted);font-size:15px}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;background:var(--leaf-500);color:#fff;cursor:pointer;min-height:48px}
button:hover{background:var(--leaf-700)}
button:disabled{cursor:default}
a{color:var(--leaf-500);font-weight:700}
a:hover{color:var(--leaf-700)}
button.alt{background:#fff;color:var(--leaf-900);border:2px solid var(--leaf-100)}
button.alt:hover{background:var(--leaf-50)}
button.warn{background:#fff;color:var(--bad);border:2px solid var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--leaf-500);outline-offset:2px}
input,select{font:inherit;width:100%;padding:12px;border:2px solid var(--leaf-100);border-radius:12px;margin:4px 0 12px;background:#fff;color:var(--leaf-900)}
label{font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--leaf-900);border-top:1px solid var(--leaf-700);display:flex;z-index:5}
nav button{flex:1;background:transparent;color:var(--leaf-100);border-radius:0;padding:14px 4px}
nav button:hover{background:var(--leaf-700);color:#fff}
nav button.on{background:var(--leaf-500);color:#fff;box-shadow:inset 0 3px 0 var(--leaf-500)}
nav button.on:hover{background:var(--leaf-500)}
footer{background:var(--leaf-900);color:#fff}
.badge{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--leaf-100);color:var(--leaf-700)}
.badge.no{background:#f6e6c4;color:#684b00}
.trust{height:8px;background:var(--leaf-100);border-radius:9px;overflow:hidden;margin-top:6px}
.trust span{display:block;height:100%;background:var(--leaf-500)}
.track{display:flex;margin:12px 0 4px}
.track div{flex:1;text-align:center;font-size:13px;color:var(--text-muted);position:relative;padding-top:20px}
.track div:before{content:"";position:absolute;top:4px;left:0;right:0;height:5px;background:var(--leaf-100)}
.track div:after{content:"";position:absolute;top:0;left:calc(50% - 7px);width:14px;height:14px;border-radius:50%;background:var(--leaf-100)}
.track .done{color:var(--leaf-900);font-weight:700}
.track .done:before{background:var(--leaf-500)}
.track .done:after{background:var(--leaf-500);box-shadow:0 0 0 3px #fff}
.err{color:var(--bad);font-weight:600;min-height:24px}
.ok{color:var(--leaf-700);font-weight:600}
.big{font-size:34px;font-weight:800}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hero{background:var(--leaf-900);color:#fff;border-radius:16px;padding:20px;margin:6px 0 16px}
.hero h1{margin:0 0 6px;font-size:26px}
.hero p{margin:0;color:var(--leaf-100)}

.slides{position:relative;display:grid;grid-template-rows:minmax(0,1fr);width:calc(100% - 32px);max-width:1280px;height:max(75vh,560px);margin:20px auto 30px;touch-action:pan-y}
.slide{grid-area:1/1;display:grid;grid-template-columns:2fr 3fr;grid-template-rows:minmax(0,1fr);gap:clamp(12px,2vw,28px);width:100%;height:100%;min-width:0;min-height:0;opacity:0;pointer-events:none;transition:opacity .9s ease}
.slide.on{opacity:1;pointer-events:auto}
.slide-photo{position:relative;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:12px;grid-column:2;grid-row:1;width:100%;height:100%;min-width:0;min-height:0}
.slide-photo:before{content:"";position:absolute;z-index:0;inset:-14px -12px 52px;background:rgba(46,125,79,.15);border-radius:48% 52% 22% 24% / 42% 44% 18% 20%}
.slide-image{position:relative;z-index:1;min-height:0;overflow:hidden;border-radius:28px;background:var(--leaf-100)}
.slide-image img{width:100%;height:100%;object-fit:cover;display:block}
.slide.on .slide-image img{animation:ken-burns 6s linear both}
.slide-thumbnails{position:relative;z-index:1;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.slide-thumbnail{min-width:0;min-height:0;padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;background:transparent;aspect-ratio:1.35}
.slide-thumbnail:hover{background:transparent}
.slide-thumbnail.on{border-color:var(--leaf-500)}
.slide-thumbnail:focus-visible{outline:3px solid var(--leaf-500);outline-offset:2px}
.slide-thumbnail img{display:block;width:100%;height:100%;object-fit:cover}
@keyframes ken-burns{from{transform:scale(1)}to{transform:scale(1.05)}}
.hero-demo-card{position:absolute;z-index:2;display:grid;gap:2px;max-width:calc(100% - 16px);padding:12px 16px;border:1px solid rgba(255,255,255,.65);border-radius:16px;background:rgba(255,255,255,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 28px rgba(22,37,28,.18);color:var(--leaf-900);animation:float-card 4s ease-in-out infinite}
.hero-demo-card.payment{top:18%;left:-18px}
.hero-demo-card.trust-score{right:-18px;bottom:18%;animation-delay:2s}
.hero-demo-card b{font-size:15px;line-height:1.3}
.hero-demo-card small{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--leaf-700)}
@keyframes float-card{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.cap{grid-column:1;grid-row:1;display:flex;flex-direction:column;justify-content:center;padding:clamp(24px,4vw,64px);border-radius:28px;background:var(--leaf-900);color:#fff}
.cap h1{font-size:clamp(36px,6.5vw,72px);font-weight:800;letter-spacing:-.02em;line-height:.98;margin:0 0 16px}
.hero-highlight{text-decoration-line:underline;text-decoration-color:var(--maize);text-decoration-thickness:.1em;text-underline-offset:.08em;text-decoration-skip-ink:auto}
.slide:first-child .hero-highlight{ text-decoration-thickness:0;animation:marker-in .8s .25s ease-out forwards}
@keyframes marker-in{to{text-decoration-thickness:.1em}}
.cap p{margin:0;font-size:18px;color:var(--leaf-100)}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.hero-cta{min-height:48px;padding:12px 18px;border-radius:12px;font:inherit;font-weight:700}
.hero-cta.primary{background:var(--leaf-500);box-shadow:0 8px 20px rgba(46,125,79,.32)}
.hero-cta.primary:hover{background:var(--leaf-700)}
.hero-cta.secondary{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.72)}
.hero-cta.secondary:hover{background:rgba(255,255,255,.1)}
.hero-proof{margin-top:16px;color:var(--leaf-100);font-size:13px;line-height:1.4}
.dots{position:absolute;left:40%;right:0;bottom:22px;z-index:3;display:flex;gap:8px;justify-content:center}
.dots button{width:14px;height:14px;min-height:0;padding:0;border-radius:50%;background:rgba(255,255,255,.45)}
.dots button.on{background:var(--maize);width:30px;border-radius:9px}
.arrow{position:absolute;top:50%;z-index:3;width:44px;height:44px;min-height:0;padding:0;border-radius:50%;background:var(--leaf-900);color:#fff;transform:translateY(-50%)}
.arrow.l{left:calc(40% + 12px)}.arrow.r{right:12px}
.bar{position:absolute;left:40%;bottom:0;height:4px;background:var(--maize);z-index:3;width:0}
.bar.run{width:60%;transition:width 6s linear}
@media(max-width:599px){
  .slides{height:auto;min-height:0;grid-template-rows:auto}
  .slide{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;gap:12px}
  .slide{height:auto}
  .slide-photo{grid-column:1;grid-row:1;grid-template-rows:auto auto;height:auto}
  .slide-photo:before{inset:-8px -8px 58px}
  .slide-image{aspect-ratio:4/5}
  .slide-thumbnails{gap:6px}
  .slide-thumbnail{border-radius:8px}
  .hero-demo-card.payment{top:16px;left:8px}
  .hero-demo-card.trust-score{right:8px;bottom:16px}
  .cap{grid-column:1;grid-row:2;min-height:180px;padding:24px 24px 60px}
  .dots{left:0;right:0;bottom:24px}
  .arrow{top:62.5vw}
  .arrow.l{left:12px}
  .bar{left:0}
  .bar.run{width:100%}
}
.photo{aspect-ratio:4/3;border-radius:20px;overflow:hidden;margin-bottom:10px;background:var(--leaf-100)}
.photo img{width:100%;height:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.ph{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:54px;font-weight:800;color:var(--leaf-700)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chips button{padding:8px 14px;min-height:40px;background:#fff;color:var(--leaf-900);border:2px solid var(--leaf-100)}
.chips button:hover{background:var(--leaf-50);color:var(--leaf-900)}
.chips button.on{background:var(--leaf-500);color:#fff;border-color:var(--leaf-500)}
.chips button.on:hover{background:var(--leaf-500);color:#fff}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:10px 0 18px}
.strip div{position:relative;aspect-ratio:1;border-radius:20px;overflow:hidden}
.strip img{width:100%;height:100%;aspect-ratio:1;object-fit:cover}
.strip span{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-weight:700;font-size:15px}
.steps{display:grid;gap:10px}
@media(min-width:600px){.steps{grid-template-columns:repeat(3,1fr)}}
.steps .card b{display:block;font-size:19px;margin-bottom:4px}
@media(prefers-reduced-motion:reduce){.slide{transition:none}.slide.on .slide-image img{animation:none}.slide:first-child .hero-highlight{animation:none;text-decoration-thickness:.1em}.hero-demo-card{animation:none}.bar.run{transition:none}}
</style>
</head>
<body>
<header><b>Trust<i>Harvest</i></b><span id="who" class="mute" style="color:var(--leaf-100)"></span></header>
<div id="hero"></div>
<main id="app"></main>
<nav id="nav" hidden></nav>
<script src="app.js"></script>
</body>
</html>
