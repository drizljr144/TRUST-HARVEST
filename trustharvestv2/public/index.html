<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustHarvest</title>
<style>
:root{--ink:#16251c;--leaf:#2e7d4f;--leaf-d:#1f5c38;--maize:#f2b705;--paper:#f1f5ee;--line:#d3ddcf;--bad:#b3261e;--mute:#5d6f63}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif}
header{background:var(--ink);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:20px;letter-spacing:.2px}
header b i{font-style:normal;color:var(--maize)}
main{max-width:720px;margin:0 auto;padding:16px 16px 90px}
h2{font-size:22px;margin:18px 0 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.price{font-weight:800;font-size:20px}
.mute{color:var(--mute);font-size:15px}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;background:var(--leaf);color:#fff;cursor:pointer;min-height:48px}
button:hover{background:var(--leaf-d)}
button.alt{background:#fff;color:var(--ink);border:2px solid var(--line)}
button.warn{background:#fff;color:var(--bad);border:2px solid var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--maize);outline-offset:2px}
input,select{font:inherit;width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;margin:4px 0 12px;background:#fff}
label{font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:5}
nav button{flex:1;background:none;color:var(--mute);border-radius:0;padding:14px 4px}
nav button.on{color:var(--leaf-d);box-shadow:inset 0 3px 0 var(--maize)}
.badge{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:99px;background:#e3efe6;color:var(--leaf-d)}
.badge.no{background:#f6e6c4;color:#7a5a00}
.trust{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.trust span{display:block;height:100%;background:var(--leaf)}
.track{display:flex;margin:12px 0 4px}
.track div{flex:1;text-align:center;font-size:13px;color:var(--mute);position:relative;padding-top:20px}
.track div:before{content:"";position:absolute;top:4px;left:0;right:0;height:5px;background:var(--line)}
.track div:after{content:"";position:absolute;top:0;left:calc(50% - 7px);width:14px;height:14px;border-radius:50%;background:var(--line)}
.track .done{color:var(--ink);font-weight:700}
.track .done:before{background:var(--leaf)}
.track .done:after{background:var(--maize);box-shadow:0 0 0 3px var(--leaf)}
.err{color:var(--bad);font-weight:600;min-height:24px}
.ok{color:var(--leaf-d);font-weight:600}
.big{font-size:34px;font-weight:800}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hero{background:var(--ink);color:#fff;border-radius:16px;padding:20px;margin:6px 0 16px}
.hero h1{margin:0 0 6px;font-size:26px}
.hero p{margin:0;color:#c9d8cd}

.slides{position:relative;display:grid;width:calc(100% - 32px);max-width:1280px;height:max(75vh,560px);margin:20px auto 30px;touch-action:pan-y}
.slide{grid-area:1/1;display:grid;grid-template-columns:2fr 3fr;gap:clamp(12px,2vw,28px);min-width:0;opacity:0;pointer-events:none;transition:opacity .9s ease}
.slide.on{opacity:1;pointer-events:auto}
.slide-photo{grid-column:2;grid-row:1;min-width:0;overflow:hidden;border-radius:28px;background:#dfe9dc}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.slide.on img{animation:ken-burns 6s linear both}
@keyframes ken-burns{from{transform:scale(1)}to{transform:scale(1.05)}}
.cap{grid-column:1;grid-row:1;display:flex;flex-direction:column;justify-content:center;padding:clamp(24px,4vw,64px);border-radius:28px;background:var(--ink);color:#fff}
.cap h1{font-size:clamp(28px,4vw,48px);line-height:1.1;margin:0 0 12px}
.cap p{margin:0;font-size:18px;color:#e3efe6}
.dots{position:absolute;left:40%;right:0;bottom:22px;z-index:3;display:flex;gap:8px;justify-content:center}
.dots button{width:14px;height:14px;min-height:0;padding:0;border-radius:50%;background:rgba(255,255,255,.45)}
.dots button.on{background:var(--maize);width:30px;border-radius:9px}
.arrow{position:absolute;top:50%;z-index:3;width:44px;height:44px;min-height:0;padding:0;border-radius:50%;background:rgba(22,37,28,.55);transform:translateY(-50%)}
.arrow.l{left:calc(40% + 12px)}.arrow.r{right:12px}
.bar{position:absolute;left:40%;bottom:0;height:4px;background:var(--maize);z-index:3;width:0}
.bar.run{width:60%;transition:width 6s linear}
@media(max-width:599px){
  .slides{height:auto;min-height:0}
  .slide{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;gap:12px}
  .slide-photo{grid-column:1;grid-row:1;aspect-ratio:4/5}
  .slide img{height:100%}
  .cap{grid-column:1;grid-row:2;min-height:180px;padding:24px 24px 60px}
  .dots{left:0;right:0;bottom:24px}
  .arrow{top:62.5vw}
  .arrow.l{left:12px}
  .bar{left:0}
  .bar.run{width:100%}
}
.photo{aspect-ratio:4/3;border-radius:10px;overflow:hidden;margin-bottom:10px;background:#dfe9dc}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.ph{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:54px;font-weight:800;color:var(--leaf)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chips button{padding:8px 14px;min-height:40px;background:#fff;color:var(--ink);border:2px solid var(--line)}
.chips button.on{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:10px 0 18px}
.strip div{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden}
.strip img{width:100%;height:100%;object-fit:cover}
.strip span{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-weight:700;font-size:15px}
.steps{display:grid;gap:10px}
@media(min-width:600px){.steps{grid-template-columns:repeat(3,1fr)}}
.steps .card b{display:block;font-size:19px;margin-bottom:4px}
@media(prefers-reduced-motion:reduce){.slide{transition:none}.slide.on img{animation:none}.bar.run{transition:none}}
</style>
</head>
<body>
<header><b>Trust<i>Harvest</i></b><span id="who" class="mute" style="color:#c9d8cd"></span></header>
<div id="hero"></div>
<main id="app"></main>
<nav id="nav" hidden></nav>
<script src="app.js"></script>
</body>
</html>
